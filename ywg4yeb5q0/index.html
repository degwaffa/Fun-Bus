<style>
  /* Layout: one narrow column of day cards under a sticky purple header, edits in a bottom sheet */
  :root{
    --bg:#f5f3ff; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --hover:#faf9ff;

    --ok:#22c55e; --wa:#1fa855; --scrim:rgba(17,12,40,.45); --shadow:rgba(30,20,60,.08);
    --f0:#2563eb; --f0-bg:#dbeafe; --f0-strong:#2563eb;
    --f1:#047857; --f1-bg:#d1fae5; --f1-strong:#059669;
    --f2:#c2410c; --f2-bg:#ffedd5; --f2-strong:#c2410c;
    --f3:#be185d; --f3-bg:#fce7f3; --f3-strong:#be185d;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#14121f; --card:#1e1b2d; --ink:#ece9f5; --muted:#a39db8; --line:#332e48; --hover:#262238;
    --accent:#6d28d9; --red:#f87171; --redbg:#3a1c24; --redline:#7f1d1d; --amber:#fbbf24; --amberbg:#3a2e12;
    --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
    --f0:#93c5fd; --f0-bg:#1d2d4d; --f1:#6ee7b7; --f1-bg:#12392e; --f2:#fdba74; --f2-bg:#43260f; --f3:#f9a8d4; --f3-bg:#45172e;
    color-scheme:dark }}
  :root[data-theme="dark"]{
    --bg:#14121f; --card:#1e1b2d; --ink:#ece9f5; --muted:#a39db8; --line:#332e48; --hover:#262238;
    --accent:#6d28d9; --red:#f87171; --redbg:#3a1c24; --redline:#7f1d1d; --amber:#fbbf24; --amberbg:#3a2e12;
    --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
    --f0:#93c5fd; --f0-bg:#1d2d4d; --f1:#6ee7b7; --f1-bg:#12392e; --f2:#fdba74; --f2-bg:#43260f; --f3:#f9a8d4; --f3-bg:#45172e;
    color-scheme:dark }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--on-accent);padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));box-shadow:0 2px 8px var(--shadow)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:680px;margin:auto}
  h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
  .status{font-size:12px;font-weight:600;background:var(--veil);border-radius:20px;padding:2px 9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .status i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .status.live i{background:var(--ok)}
  .me select{border:0;border-radius:20px;padding:5px 10px;font-size:14px;background:var(--veil);color:var(--on-accent);max-width:40vw}
  .me option{color:var(--ink);background:var(--card)}
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:6px auto 0;max-width:680px}
  .weeknav button{background:var(--veil);border:0;color:var(--on-accent);border-radius:8px;padding:4px 12px;font-size:18px;cursor:pointer}
  .weeknav button:disabled{opacity:.35;cursor:default}
  .weeknav .wc{font-weight:600;text-align:center}
  .weeknav .term{font-size:12px;font-weight:600;opacity:.9;margin-top:1px}
  .day.noschool{opacity:.6}
  .dh em{font-style:normal;font-weight:600;font-size:12px;color:var(--muted);margin-left:8px}
  .wrap{max-width:680px;margin:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .tools{display:flex;gap:6px;overflow-x:auto;padding-top:10px}
  .tools button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
  .tools button.primary{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
  main{padding-top:10px}
  .banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
  .banner.warn{background:var(--amberbg);color:var(--amber);border-color:transparent}
  .day{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
  .dh{padding:8px 12px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .dh span{font-weight:400;color:var(--muted);font-size:13px}
  .dh .notebtn{border:0;background:none;cursor:pointer;font-size:15px;padding:0 6px;margin-right:2px;opacity:.55}
  .dh .notebtn:hover,.dh .notebtn:focus-visible{opacity:1}
  .dmsg{container-type:inline-size;overflow:hidden;white-space:nowrap;background:var(--amberbg);color:var(--amber);font-size:14px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer}
  .dmsg .track{display:inline-flex;animation:ticker var(--t,12s) linear infinite}
  .dmsg .track span{min-width:100cqw;padding:6px 3em 6px 12px}
  .dmsg:hover .track{animation-play-state:paused}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){
    .dmsg{white-space:normal}.dmsg .track{animation:none;display:block}.dmsg .track span{min-width:0;display:block;padding:6px 12px}.dmsg .track span+span{display:none}
  }
  .slot{display:flex;gap:10px;padding:8px 12px;align-items:flex-start}

  table.tally td{text-align:center;padding:4px}

  .sheet h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;gap:10px}
  .sheet .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink)}

  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;text-decoration:none}
  .btn.red{color:var(--red)}
  .btn.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;width:100%;padding:11px;font-size:16px;margin-top:6px}
  .btn:disabled{opacity:.6;cursor:default}
  .row .btn.go{width:auto;flex:1;margin:0}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 0}
  .err{font-size:13px;color:var(--red);min-height:1.2em;margin:8px 0 0}
  .sec{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
  textarea{width:100%;height:280px;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
  textarea.short{height:140px}
  .welcome{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;margin:auto;width:100%;max-width:380px;text-align:center;max-height:90vh;overflow:auto}
  .welcome form{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
  .welcome .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .heart{position:fixed;bottom:-40px;z-index:40;pointer-events:none;font-size:28px;animation:heartUp var(--dur,2.4s) ease-out forwards}
  @keyframes heartUp{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx,0px),-110vh) scale(1.2) rotate(var(--rot,0deg));opacity:0}}
  @media (prefers-reduced-motion: reduce){.heart{animation-duration:1.2s}}

</style>

<header>
  <div class="top">
    <h1>🚌 Fun Bus <span class="status" id="status"><i></i><span>Connecting…</span></span></h1>

        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="sea" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></radialGradient>

          </defs>
          <circle cx="50" cy="50" r="49" fill="url(#sea)"/>
          <g clip-path="url(#ball)" fill="#22c55e">
            <path d="M18 22c8-6 20-7 26-2 5 4 1 10-5 12-5 2-4 8-9 11-6 4-12-1-14-7-2-5-4-10 2-14z"/>
            <path d="M33 50c5-2 11 1 12 7 1 7-3 12-4 19-1 6-6 9-9 4-3-6-1-12-4-18-2-6 0-10 5-12z"/>
            <path d="M55 16c7-4 18-3 26 3 6 5 9 12 4 16-5 3-11 0-16 3-5 3-3 9-9 10-6 1-8-5-7-11 1-5-4-8-3-13 0-4 2-6 5-8z"/>
            <path d="M60 50c6-2 12 2 13 8 1 7-4 13-10 15-5 2-9-3-8-9 0-5-1-12 5-14z"/>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
// No names or schedules live in this file: the families and the usual week are stored
// in the club's database, which only opens with the club code.

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const AM_DEFAULT = "07:30", PM_DEFAULT = "18:00";
// Times are shown and saved as 24-hour HH:MM. Older or typed times like "7.30", "730" or "6"
// are understood too; on an evening run, an hour before 12 means the evening (6.00 → 18:00).
function hhmm(t, p){
  const m = String(t??"").trim().match(/^(\d{1,2})(?:[.:h]?(\d{2}))?$/);
  if(!m) return String(t??"").trim();
  let h = +m[1]; const mi = +(m[2]||0);
  if(p==="pm" && h<12) h += 12;
  if(h>23 || mi>59) return String(t).trim();
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
const SWATCH = ["f0","f1","f2","f3"];
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Club (loaded from the database) ----------
let FAM = {}, KIDS = [], PEOPLE = [], DRIVERS = [];
function setClub(cfg){
  FAM = {};
  cfg.families.forEach((f,i)=>{ FAM["F"+i] = {name:f.name, parents:f.parents.slice(0,2), kids:f.kids.slice(), c:SWATCH[i]}; });
  KIDS    = Object.values(FAM).flatMap(f=>f.kids);
  PEOPLE  = Object.values(FAM).flatMap(f=>f.parents);
  DRIVERS = Object.values(FAM).flatMap(f=>f.parents.length>1 ? [...f.parents, f.parents.join("/")] : f.parents);
}
const famOfDriver = d => Object.keys(FAM).find(k=>FAM[k].parents.includes(String(d).split("/")[0]));
const famOfKid = k => Object.keys(FAM).find(f=>FAM[f].kids.includes(k));
const byKid = (a,b)=>KIDS.indexOf(a)-KIDS.indexOf(b);
const col   = f => `var(--${FAM[f].c})`;
const tint  = f => `var(--${FAM[f].c}-bg)`;
const solid = f => `var(--${FAM[f].c}-strong)`;

const run  = (time, driver, kids=[...KIDS]) => ({time, driver, kids, swap:false});
const slot = (...runs) => ({runs, out:{}, own:false, off:false});
function basicTemplate(){
  const t = {};
  DAYS.forEach((d,i)=>{ t[d] = {am:slot(run(AM_DEFAULT, PEOPLE[i%PEOPLE.length])), pm:slot(run(PM_DEFAULT, PEOPLE[(i+1)%PEOPLE.length]))}; });
  return t;
}

// ---------- Setup text validation ----------
const str = (v, max=40) => typeof v==="string" && v.trim().length>0 && v.length<=max;
function readSetup(text){
  let o;
  try{ o = JSON.parse(text); }catch{ throw new Error("The setup text isn't complete. Copy all of it, from the first { to the last }."); }
  const fams = o && o.families;
  if(!Array.isArray(fams) || fams.length<1 || fams.length>4) throw new Error("The setup needs between 1 and 4 families.");
  const seen = new Set();
  const families = fams.map(f=>{
    if(!f || !str(f.name) || !Array.isArray(f.parents) || f.parents.length<1 || f.parents.length>2 || !f.parents.every(p=>str(p))
       || !Array.isArray(f.kids) || f.kids.length<1 || f.kids.length>3 || !f.kids.every(k=>str(k)))
      throw new Error("Each family needs a name, 1 or 2 parents and 1 to 3 children.");
    for(const n of [...f.parents, ...f.kids]){ if(seen.has(n)) throw new Error(`"${n}" appears twice. Every name needs to be different.`); seen.add(n); }
    return {name:f.name.trim(), parents:f.parents.map(p=>p.trim()), kids:f.kids.map(k=>k.trim())};
  });
  setClub({families});
  let days = basicTemplate();
  if(o.usualWeek){
    try{
      const u = o.usualWeek, out = {};
      for(const d of DAYS){ out[d] = {}; for(const p of ["am","pm"]) out[d][p] = normSlot(u[d][p]); }
      days = out;
    }catch{ throw new Error("The usual week in the setup text doesn't look right."); }
  }
  return {families, days};
}
function normSlot(s){
  const runs = s.runs.map(r=>{
    if(!str(r.time,10) || !DRIVERS.includes(r.driver) || !Array.isArray(r.kids)) throw 0;
    return {time:r.time, driver:r.driver, kids:r.kids.filter(k=>KIDS.includes(k)), swap:false};
  });
  if(!runs.length) throw 0;
  return {runs, out:{}, own:!!s.own, off:!!s.off};
}

async function clubIdFor(code){
  const norm = code.trim().toLowerCase().replace(/\s+/g," ");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fun-bus:"+norm));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return d; };
function mondayOf(d){ d=new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return keyOf(d); }
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LONGMONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const fmtLong  = d => `${d.getDate()} ${LONGMONTHS[d.getMonth()]} ${d.getFullYear()}`;

// ---------- School term dates (Bedales Senior) ----------
// From "Bedales Senior School Term & Key Dates 2026 – 2027" (corrected 07.07.26).
// Each term: days (Mon–Sat) from `first` to `last` are school days, except the `off` ranges (half
// terms, long leaves, including their Saturdays). `notes` puts a short label on a day. Weekdays between terms are holidays; days after
// the last term listed are unknown and shown without a label, so add each new year here when it's out.
const TERMS = [
  {name:"Autumn term", first:"2026-09-08", last:"2026-12-11",
   off:[{name:"Long leave", start:"2026-09-26", end:"2026-09-27"},
        {name:"Half term", start:"2026-10-17", end:"2026-11-01"},
        {name:"Long leave", start:"2026-11-20", end:"2026-11-22"}],
   notes:{"2026-10-16":"Half term from 16:30", "2026-11-19":"Long leave from 16:30",
          "2026-12-11":"Last day: day pupils 13:00"}},
  {name:"Spring term", first:"2027-01-04", last:"2027-03-25",
   off:[{name:"6.2 mocks only", start:"2027-01-04", end:"2027-01-05"},
        {name:"Long leave", start:"2027-01-23", end:"2027-01-24"},
        {name:"Half term", start:"2027-02-12", end:"2027-02-21"},
        {name:"Long leave", start:"2027-03-13", end:"2027-03-14"}],
   notes:{"2027-01-06":"Term starts 09:00", "2027-01-22":"Long leave weekend from 16:30",
          "2027-02-11":"Half term from 16:30", "2027-03-12":"Long leave weekend from 16:30",
          "2027-03-25":"Last day: ends 16:30"}},
  {name:"Summer term", first:"2027-04-19", last:"2027-07-01",
   off:[{name:"Long leave", start:"2027-05-01", end:"2027-05-03"},
        {name:"Half term", start:"2027-05-29", end:"2027-06-06"}],
   notes:{"2027-04-19":"Term starts 09:00", "2027-04-30":"Long leave from 16:30",
          "2027-05-28":"Half term from 16:30", "2027-06-26":"Parents' Day",
          "2027-07-01":"Last day: Blocks 3–4 12:45, 5 & 6.1 13:30"}},
];
const TERMS_FIRST = TERMS.reduce((m,t)=>!m||t.first<m?t.first:m, "");
const TERMS_LAST  = TERMS.reduce((m,t)=>t.last>m?t.last:m, "");
// For a day: {type: school | break | holiday | unknown, label}
function schoolDay(k){
  const t = TERMS.find(t=>k>=t.first && k<=t.last);
  if(t){
    const b = t.off.find(b=>k>=b.start && k<=b.end);
    if(b) return {type:"break", label:b.name};
    return {type:"school", label:t.notes[k]||""};
  }
  if(!TERMS_FIRST || k<TERMS_FIRST || k>TERMS_LAST) return {type:"unknown", label:""};
  return {type:"holiday", label:"Holidays"};
}
const noSchool = k => { const t = schoolDay(k).type; return t==="break" || t==="holiday"; };
function weekTerm(k){
  const days = [0,1,2,3,4].map(i=>schoolDay(keyOf(addDays(k,i)))); // Mon–Fri
  const types = new Set(days.map(d=>d.type));
  if(types.size===1){
    const t = [...types][0];
    if(t==="school") return "🏫 School week";
    if(t==="break") return `🌿 ${days[0].label}`;
    if(t==="holiday") return "☀️ Holidays";
    return "Term dates not added yet";
  }
  const sch = days.map((d,i)=>d.type==="school"?i:-1).filter(i=>i>=0);
  if(!sch.length) return days.find(d=>d.type==="break") ? `🌿 ${days.find(d=>d.type==="break").label}` : "☀️ Holidays";
  const dayName = i => `${DAYS[i].slice(0,3)} ${fmtShort(addDays(k,i))}`;
  if(sch[0]>0 && days[sch[0]-1].type!=="unknown") return `🏫 School from ${dayName(sch[0])}`;
  return `🏫 School until ${dayName(sch[sch.length-1])}`;
}

// ---------- Week helpers ----------
// A week nobody has touched yet starts blank: default times, but no drivers and no kids on any run.
// It's only saved once someone changes it.
function blankDays(){
  const d = {};
  for(const day of DAYS){ d[day] = {}; for(const p of ["am","pm"]){
    const t = template && template[day] && template[day][p] && template[day][p].runs[0];
    d[day][p] = slot(run(hhmm(t ? t.time : (p==="am" ? AM_DEFAULT : PM_DEFAULT), p), "", []));
  } }
  return d;
}
const getWeek = k => weeks[k] || {days:blankDays(), log:[]};
const ready = () => mode==="live" && loaded.weeks && loaded.tpl;

// Club rules: mornings are one car; a child alone on an evening run is collected by their own parents
function applyRules(p, s){
  if(p==="am" && s.runs.length>1){
    s.runs[0].kids = [...new Set(s.runs.flatMap(r=>r.kids))];
    s.runs.length = 1;
  }
  if(p==="pm") for(const r of s.runs){
    if(r.kids.length===1){
      const f = famOfKid(r.kids[0]);
      if(f && famOfDriver(r.driver)!==f) r.driver = FAM[f].parents.join("/");
    }
  }
}

  else if(c==="resource-exhausted") toast("The board is over its free daily limit, so that change wasn't saved. Try again tomorrow.");

const kidChip = k => { const f=famOfKid(k); return `<span class="kid" style="background:${f?tint(f):'var(--line)'};color:${f?col(f):'var(--ink)'}">${esc(k)}</span>`; };

function runHtml(day,p,i,s,r){
  const solo = p==="pm" && r.kids.length===1;
  return `<div class="run ${r.swap?'swap':''}">
    <span class="time">${esc(hhmm(r.time,p))}</span>${drvChip(r.driver)}

    ${r.swap?`<span class="note">needs cover</span><button class="claim" data-claim="${day}|${p}|${i}">🙋 I'll take it</button>`:''}
  </div>`;
}
function slotHtml(day,p,s){
  let body;
  if(s.off) body = `<div class="muted">— No run</div>`;
  else if(s.own) body = `<div class="muted">🏠 Everyone takes their own</div>`;
  else {
    // A child who isn't on any run simply isn't needed on this one
    body = s.runs.map((r,i)=>r.kids.length?runHtml(day,p,i,s,r):"").join("");
    if(!s.runs.some(r=>r.kids.length)) body += `<div class="muted">Unassigned</div>`;
  }
  return `<div class="slot" data-d="${day}" data-p="${p}" tabindex="0" role="button" aria-label="Edit ${day} ${p.toUpperCase()}"><div class="lab">${p.toUpperCase()}</div><div class="runs">${body}</div></div>`;
}
// Runs driven per family, counting only days whose date passes `keep` (default: every day of the week)
function countRuns(days, wk, keep=()=>true){
  const c = {}; Object.keys(FAM).forEach(f=>c[f]=0);
  for(const [i,day] of DAYS.entries()) for(const p of ["am","pm"]){
    const dk = keyOf(addDays(wk,i));
    if(!keep(dk) || noSchool(dk)) continue;
    const s = days[day][p]; if(s.off||s.own) continue;
    for(const r of s.runs){
      if(!r.kids.length) continue;
      if(p==="pm" && r.kids.length===1) continue; // own pickup — not a club run
      const f = famOfDriver(r.driver); if(f) c[f]++;
    }
  }
  return c;
}

}

// ---------- Miles driven (everyone, all time) ----------
const MILES_ONE_WAY = 25, RUN_MILES = MILES_ONE_WAY*2, EARTH_MILES = 24901;
// Runs that have actually happened: a driver, at least one child, a school day, and a start time
// that has passed. Every car counts, own pickups included: those miles were still driven.
function runsDriven(now = new Date()){
  let n = 0;
  for(const [k,wk] of Object.entries(weeks)){
    if(!wk || !wk.days) continue;
    for(const [i,day] of DAYS.entries()){
      const date = addDays(k,i);
      if(date > now || noSchool(keyOf(date))) continue;
      for(const p of ["am","pm"]){
        const s = wk.days[day] && wk.days[day][p];
        if(!s || s.off || s.own || !Array.isArray(s.runs)) continue;
        for(const r of s.runs){
          if(!r || !r.driver || !r.kids || !r.kids.length) continue;
          const when = new Date(date), t = hhmm(r.time,p).match(/^(\d\d):(\d\d)$/);
          if(t) when.setHours(+t[1], +t[2]); else when.setHours(p==="am" ? 7 : 18, 30);
          if(when <= now) n++;
        }
      }
    }
  }
  return n;
}
let shownMiles = null;
function renderMiles(){
  const runs = runsDriven(), miles = runs*RUN_MILES;
  if(miles===shownMiles) return;
  const first = shownMiles===null; shownMiles = miles;
  const laps = Math.floor(miles/EARTH_MILES), pct = (miles%EARTH_MILES)/EARTH_MILES*100;
  const pctTxt = pct<10 && pct>0 ? pct.toFixed(1) : Math.floor(pct);
  document.getElementById("milesNum").innerHTML = `${miles.toLocaleString("en-GB")} <small>miles</small>`;
  document.getElementById("milesRuns").textContent = `${runs.toLocaleString("en-GB")} run${runs===1?"":"s"} × ${RUN_MILES} miles`;
  document.getElementById("milesLap").textContent = laps
    ? `🌍 ${laps} lap${laps===1?"":"s"} of the Earth + ${pctTxt}% of the next`
    : `🌍 ${pctTxt}% of the way round the Earth`;
  // The car drives anticlockwise from the top. The angle keeps growing past 360° so it never drives backwards.
  const orbit = document.getElementById("orbit"), deg = -(miles/EARTH_MILES)*360;
  if(first) requestAnimationFrame(()=>requestAnimationFrame(()=>{ orbit.style.transform = `rotate(${deg}deg)`; }));
  else orbit.style.transform = `rotate(${deg}deg)`;
}
// Runs tick over as their start times pass, so check every minute
setInterval(()=>{ if(ready()) renderMiles(); }, 60000);

    }catch(x){ err.textContent = "Couldn't check the code. Check your connection and try again."; go.disabled = false; }

    go.disabled = true;
    try{

      if(existing.exists){ err.textContent = "That code is already taken. Pick a different one."; go.disabled = false; return; }

      go.disabled = false;
    }
  }
});

function openSlot(day,p){
  const s = clone(getWeek(cur).days[day][p]);
  s.out = {}; // "not needed" is no longer kept separately: a child not on a run isn't needed
  ctx = {day, p, s, before: JSON.stringify(s)};
  drawSlot();
}
function drawSlot(){
  const {day,p,s} = ctx;
  applyRules(p,s);
  const cars = s.runs.map((r,i)=>`
    <div class="car ${r.swap?'swap':''}">
      ${s.runs.length>1?`<div class="sec" style="margin-top:0">Car ${i+1}</div>`:""}
      <div class="row"><label for="t${i}">Time</label><input class="t" id="t${i}" type="text" inputmode="decimal" data-act="time" data-i="${i}" value="${esc(hhmm(r.time,p))}">
        <label for="d${i}">Driver</label><select id="d${i}" data-act="driver" data-i="${i}">${r.driver?"":`<option value="" selected>— choose —</option>`}${DRIVERS.map(d=>`<option ${d===r.driver?"selected":""}>${esc(d)}</option>`).join("")}</select></div>
      <div class="row"><label>Kids</label>${KIDS.map(k=>{
        const on=r.kids.includes(k), f=famOfKid(k);
        return `<button class="tog ${on?'on':'off'}" style="color:${col(f)};background:${on?tint(f):'var(--card)'}" data-act="kid" data-i="${i}" data-k="${esc(k)}">${esc(k)}</button>`}).join("")}</div>
      ${p==="pm"&&r.kids.length===1?`<p class="hint">🏠 ${esc(r.kids[0])} is on their own, so the ${esc(famLabel(famOfKid(r.kids[0])))} parents collect.</p>`:""}
      <div class="row" style="margin:0">
        <button class="btn ${r.swap?'':'red'}" data-act="swap" data-i="${i}">${r.swap?"✓ Cover found / cancel request":"🔁 Can't do it — ask for cover"}</button>
        ${s.runs.length>1?`<button class="btn" data-act="delcar" data-i="${i}">Remove car</button>`:""}
      </div>
    </div>`).join("");
  showSheet(`<div class="sheet" role="dialog" aria-modal="true">
    <h2>${day} ${p.toUpperCase()} <button class="x" data-act="close" aria-label="Close">×</button></h2>
    <div class="row">
      <button class="tog ${s.off?'on':''}" data-act="off">— No run</button>
      <button class="tog ${s.own?'on':''}" data-act="own">🏠 Everyone takes their own</button>
    </div>
    ${s.off||s.own?"":`
      ${cars}
      ${p==="pm"&&s.runs.length<2?`<button class="btn" data-act="addcar">＋ Add a second car (clubs finish at different times)</button>`:""}
      ${p==="am"?`<p class="hint">Mornings are always one car for everyone.</p>`:""}
      <p class="hint">Tap the kids going on each car. Anyone not tapped isn't needed.</p>
    `}
    <button class="btn go" data-act="close">Save</button>
  </div>`);
}
function closeSlot(){
  const {day,p,s,before} = ctx;
  if(s.runs.length>1) s.runs = s.runs.filter(r=>r.kids.length);
  if(!s.runs.length) s.runs=[run(p==="am"?AM_DEFAULT:PM_DEFAULT, me||PEOPLE[0], [])];
  s.runs.forEach(r=>{ r.time = hhmm(r.time, p); });
  applyRules(p,s);
  hideSheet();
  if(JSON.stringify(s)!==before) changeWeek(w=>{ w.days[day][p]=s; }, `updated ${day} ${p.toUpperCase()}`);
}

// ---------- A little love ----------
// One driver gets a stream of hearts whenever they're picked. They're recognised by a fingerprint of
// their name, so no names live in this file.
const HEART_FOR = "512b2a7a713d7fa96dda8c6347599b1f5601cc0a666589242994ffd9d9bdf996";
async function heartsFor(driver){
  if(!driver || !crypto.subtle) return;
  for(const name of String(driver).split("/")){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fun-bus-hearts:"+name.trim().toLowerCase()));
    const hex = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    if(hex===HEART_FOR){ heartStream(); return; }
  }
}
function heartStream(){
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const n = calm ? 8 : 36, glyphs = ["❤️","💖","💕","💗","💘","💓"];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const h = document.createElement("span");
    h.className = "heart"; h.setAttribute("aria-hidden","true");
    h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    h.style.left = (5 + Math.random()*90) + "vw";
    h.style.fontSize = (20 + Math.random()*22) + "px";
    h.style.setProperty("--dx", (Math.random()*120-60) + "px");
    h.style.setProperty("--rot", (Math.random()*60-30) + "deg");
    h.style.setProperty("--dur", (calm ? 1.2 : 2 + Math.random()*1.6) + "s");
    document.body.appendChild(h);
    h.addEventListener("animationend", ()=>h.remove());
  }, i*(calm ? 120 : 70));
}

// ---------- WhatsApp text (in the group's usual format) ----------
function shareText(){
  const w = getWeek(cur), out = [`Week commencing ${fmtLong(parseKey(cur))}`];
  for(const [i,day] of DAYS.entries()){ for(const p of ["am","pm"]){
    const s = w.days[day][p], lab = `${day} ${p.toUpperCase()}`;
    if(noSchool(keyOf(addDays(cur,i)))){ if(p==="am") out.push(`${day} - no school`); continue; }
    if(s.off) continue;
    if(s.own){ out.push(`${lab} - everyone takes their own`); continue; }
    const runs = s.runs.filter(r=>r.kids.length);
    const notNeeded = KIDS.filter(k=>!runs.some(r=>r.kids.includes(k)));
    const nn = notNeeded.length ? `no ${kidList(notNeeded)}` : "";
    const cover = r => r.swap ? " ⚠️ needs cover" : "";
    if(!runs.length) continue;
    if(runs.length===1){
      const r=runs[0], parts=[];
      if(p==="pm" || hhmm(r.time,p)!==AM_DEFAULT) parts.push(hhmm(r.time,p));
      if(nn) parts.push(nn);
      out.push(`${lab}${parts.length?` (${parts.join(", ")})`:""} - ${r.driver||"driver needed"}${cover(r)}`);
    } else {
      out.push(`${lab} ` + runs.map(r=>`(${hhmm(r.time,p)} ${kidList(r.kids)}) - ${r.driver||"driver needed"}${cover(r)}`).join(" "));
    }
  }
    if((w.days[day].note||"").trim()) out.push(`📝 ${day}: ${w.days[day].note.trim()}`);
  }
  out.push("", `Board: ${location.origin}${location.pathname}`);
  return out.join("\n");
}
// ---------- Week as a picture (for WhatsApp) ----------
// Drawn straight onto a canvas in light colours, so it looks the same on every phone.
const IMG = {
  bg:"#f5f3ff", card:"#ffffff", ink:"#1f2937", muted:"#6b7280", line:"#e5e7eb", accent:"#7c3aed",
  amber:"#92400e", amberbg:"#fef3c7", red:"#dc2626", redbg:"#fef2f2", off:"#f3f4f6",
  fam:{ f0:{s:"#2563eb",bg:"#dbeafe",ink:"#1d4ed8"}, f1:{s:"#059669",bg:"#d1fae5",ink:"#047857"},
        f2:{s:"#c2410c",bg:"#ffedd5",ink:"#c2410c"}, f3:{s:"#be185d",bg:"#fce7f3",ink:"#be185d"} },
  font:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
};
function weekCanvas(){
  const W = 1080, PAD = 28, DAYW = 178, GAP = 14, CELLW = (W - PAD*2 - DAYW - GAP*2 - 28) / 2;
  const w = getWeek(cur);
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const font = (wt, px) => `${wt} ${px}px ${IMG.font}`;
  const famC = f => f ? IMG.fam[FAM[f].c] : {s:IMG.muted, bg:IMG.off, ink:IMG.muted};
  const rr = (x0,y0,w0,h0,r) => { x.beginPath(); x.moveTo(x0+r,y0); x.arcTo(x0+w0,y0,x0+w0,y0+h0,r); x.arcTo(x0+w0,y0+h0,x0,y0+h0,r); x.arcTo(x0,y0+h0,x0,y0,r); x.arcTo(x0,y0,x0+w0,y0,r); x.closePath(); };
  // Word-wrap plain text to a width; returns lines
  const wrap = (txt, maxW) => { const out=[]; let line=""; for(const word of String(txt).split(/\s+/)){ const t=line?line+" "+word:word; if(line && x.measureText(t).width>maxW){ out.push(line); line=word; } else line=t; } if(line) out.push(line); return out; };

  // Lay out one AM/PM cell as a list of positioned items, then return its height
  function cellItems(p, s){
    const items = []; let lx = 0, ly = 0; const LH = 46;
    const place = (wd, draw) => { if(lx>0 && lx+wd>CELLW){ lx = 0; ly += LH; } items.push({x:lx, y:ly, draw}); lx += wd + 7; };
    if(s.off){ x.font=font(500,22); items.push({x:0,y:0,draw:(X,Y)=>{x.fillStyle=IMG.muted;x.font=font(500,22);x.fillText("No run",X,Y+29);}}); return {items,h:LH}; }
    if(s.own){ x.font=font(500,22); items.push({x:0,y:0,draw:(X,Y)=>{x.fillStyle=IMG.muted;x.font=font(500,22);x.fillText("🏠 Everyone takes their own",X,Y+29);}}); return {items,h:LH}; }
    const runs = s.runs.filter(r=>r.kids.length);
    if(!runs.length){ items.push({x:0,y:0,draw:(X,Y)=>{x.fillStyle=IMG.muted;x.font=font(500,22);x.fillText("—",X,Y+29);}}); return {items,h:LH}; }
    runs.forEach((r,ri)=>{
      if(ri>0){ lx = 0; ly += LH; }
      const t = hhmm(r.time,p); x.font = font(700,24); const tw = x.measureText(t).width;
      place(tw, (X,Y)=>{ x.fillStyle=IMG.ink; x.font=font(700,24); x.fillText(t,X,Y+30); });
      const dname = r.driver || "Driver needed", dc = r.driver ? famC(famOfDriver(r.driver)) : null;
      x.font = font(700,22); const dw = x.measureText(dname).width + 22;
      place(dw, (X,Y)=>{ rr(X,Y+4,dw,36,18); if(dc){ x.fillStyle=dc.s; x.fill(); x.fillStyle="#fff"; } else { x.fillStyle=IMG.redbg; x.fill(); x.strokeStyle=IMG.red; x.lineWidth=2; x.stroke(); x.fillStyle=IMG.red; } x.font=font(700,22); x.fillText(dname,X+11,Y+30); });
      for(const k of r.kids){
        const kc = famC(famOfKid(k)); x.font = font(600,20); const kw = x.measureText(k).width + 16;
        place(kw, (X,Y)=>{ rr(X,Y+6,kw,32,16); x.fillStyle=kc.bg; x.fill(); x.fillStyle=kc.ink; x.font=font(600,20); x.fillText(k,X+8,Y+29); });
      }
      const tags = [];
      if(p==="pm" && r.kids.length===1) tags.push(["own pickup", IMG.muted, IMG.off]);
      if(r.swap) tags.push(["needs cover", IMG.red, IMG.redbg]);
      for(const [tg,fg,bg] of tags){
        x.font = font(600,18); const gw = x.measureText(tg).width + 18;
        place(gw, (X,Y)=>{ rr(X,Y+9,gw,28,14); x.fillStyle=bg; x.fill(); x.fillStyle=fg; x.font=font(600,18); x.fillText(tg,X+9,Y+29); });
      }
    });
    return {items, h: ly + LH};
  }

  function paint(dry){
    let y = 0;
    // Header
    const HEAD = 150;
    if(!dry){ x.fillStyle=IMG.bg; x.fillRect(0,0,c.width,c.height); x.fillStyle=IMG.accent; x.fillRect(0,0,W,HEAD);
      x.fillStyle="#fff"; x.font=font(800,44); x.fillText("🚌 Fun Bus", PAD, 62);
      x.font=font(600,30); x.fillText(`Week commencing ${fmtLong(parseKey(cur))}`, PAD, 106);
      x.globalAlpha=.85; x.font=font(600,24); x.fillText(weekTerm(cur), PAD, 138); x.globalAlpha=1; }
    y = HEAD + 22;
    // Column headings
    const AMX = PAD + 14 + DAYW + GAP, PMX = AMX + CELLW + GAP;
    if(!dry){ x.fillStyle=IMG.muted; x.font=font(700,22); x.fillText("☀️ AM", AMX, y+22); x.fillText("🌙 PM", PMX, y+22); }
    y += 40;
    DAYS.forEach((day,i)=>{
      const dk = keyOf(addDays(cur,i)), sd = schoolDay(dk), off = sd.type==="break" || sd.type==="holiday";
      const label = off ? (sd.label && sd.label!=="Holidays" ? `No school · ${sd.label}` : "No school") : sd.label;
      const msg = (w.days[day].note||"").trim();
      // Left column: day, date, label
      x.font = font(500,19); const labLines = label ? wrap(label, DAYW-6) : [];
      const leftH = 34 + 28 + labLines.length*24;
      let am = null, pm = null, cellsH = 0;
      if(!off){ am = cellItems("am", w.days[day].am); pm = cellItems("pm", w.days[day].pm); cellsH = Math.max(am.h, pm.h); }
      x.font = font(600,21); const noteLines = msg ? wrap("📝 " + msg, W - PAD*2 - 48) : [];
      const bodyH = Math.max(leftH, off ? 0 : cellsH);
      const rowH = 22 + bodyH + 18 + (noteLines.length ? noteLines.length*30 + 22 : 0);
      if(!dry){
        rr(PAD, y, W-PAD*2, rowH, 18); x.fillStyle = off ? IMG.off : IMG.card; x.fill();
        x.strokeStyle = IMG.line; x.lineWidth = 2; x.stroke();
        const top = y + 22, lx = PAD + 20;
        x.fillStyle = off ? IMG.muted : IMG.ink; x.font=font(800,26); x.fillText(day, lx, top+26);
        x.fillStyle = IMG.muted; x.font=font(500,21); x.fillText(fmtShort(parseKey(dk)), lx, top+56);
        x.font=font(600,19); x.fillStyle = off ? IMG.muted : IMG.accent; labLines.forEach((l,j)=>x.fillText(l, lx, top+84+j*24));
        if(off){ x.fillStyle=IMG.muted; x.font=font(600,24); x.fillText("No runs needed", AMX, top+30); }
        else {
          x.strokeStyle=IMG.line; x.lineWidth=2; x.beginPath(); x.moveTo(PMX-GAP/2, top-6); x.lineTo(PMX-GAP/2, top+bodyH+4); x.stroke();
          for(const it of am.items) it.draw(AMX+it.x, top+it.y);
          for(const it of pm.items) it.draw(PMX+it.x, top+it.y);
        }
        if(noteLines.length){
          const ny = top + bodyH + 14; rr(PAD+14, ny, W-PAD*2-28, noteLines.length*30+14, 12); x.fillStyle=IMG.amberbg; x.fill();
          x.fillStyle=IMG.amber; x.font=font(600,21); noteLines.forEach((l,j)=>x.fillText(l, PAD+28, ny+30+j*30));
        }
      }
      y += rowH + 12;
    });
    // Footer
    if(!dry){ x.fillStyle=IMG.muted; x.font=font(500,20); x.fillText(`Live board: ${location.host}${location.pathname}`, PAD, y+26); }
    return y + 48;
  }
  c.width = W; c.height = 10; const H = paint(true);
  c.width = W; c.height = Math.ceil(H); paint(false);
  return c;
}
let shareBlob = null;
document.getElementById("share").onclick = ()=>{
  const t = shareText();
  const canvas = weekCanvas();
  shareBlob = null; canvas.toBlob(b=>{ shareBlob = b; }, "image/png");
  showSheet(`<div class="sheet" role="dialog" aria-modal="true"><h2>Share this week <button class="x" data-act="dismiss" aria-label="Close">×</button></h2>
    <img src="${canvas.toDataURL("image/png")}" alt="This week's runs as a picture" style="width:100%;border-radius:12px;border:1px solid var(--line);display:block">
    <div class="row" style="margin-top:10px">
      <button class="btn go" data-act="shareimg">📤 Share picture</button>
      <button class="btn" data-act="saveimg">⬇️ Save</button>
    </div>
    <details style="margin-top:6px"><summary class="note" style="cursor:pointer">Send as text instead</summary>
      <textarea id="shareTxt" aria-label="Message text" style="margin-top:8px">${esc(t)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" data-act="copytext">📋 Copy</button>
        <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">💬 Open WhatsApp</a>
      </div></details></div>`);
};
async function weekBlob(){
  if(shareBlob) return shareBlob;
  return await new Promise(r=>weekCanvas().toBlob(r, "image/png"));
}
function saveWeekImage(blob){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `fun-bus-${cur}.png`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

// ---------- Start ----------
function openClub(cfgData){
  setClub(cfgData);
  if(me && !PEOPLE.includes(me)){ me = null; local.set("fb_me", null); }
  mode = "live"; loaded = {weeks:false, tpl:false}; stale = false;
  unsubs.forEach(u=>u()); unsubs = [];
  const firm = {weeks:false, tpl:false};
  const timer = setTimeout(()=>{ if(!(firm.weeks&&firm.tpl)){ stale = true; render(); } }, 10000);
  const settle = (which, meta)=>{
    loaded[which] = true;
    if(!meta.fromCache) firm[which] = true;
    stale = !(firm.weeks && firm.tpl) && stale;
    if(firm.weeks && firm.tpl) clearTimeout(timer);
    render();
  };
  const onErr = e=>{
    clearTimeout(timer);
    if(e && e.code==="permission-denied"){ local.set("fb_club", null); club = null; mode = "code"; render(); askCode("That code no longer opens the board. Check it with the group."); return; }
    stale = true; render();
  };
  unsubs.push(fs.collection(P.weeks(club)).onSnapshot({includeMetadataChanges:true}, snap=>{
    const next = {};
    snap.docs.forEach(doc=>{ const v=doc.data(); if(v && v.days && doc.id>=FIRST_WEEK) next[doc.id]=v; });
    weeks = next;
    pendingWrites = snap.metadata.hasPendingWrites;
    settle("weeks", snap.metadata);
  }, onErr));
  unsubs.push(fs.doc(P.tpl(club)).onSnapshot({includeMetadataChanges:true}, snap=>{
    const v = snap.exists ? snap.data() : null;
    template = v && v.days ? v.days : basicTemplate();
    settle("tpl", snap.metadata);
  }, onErr));
  render();
  if(!me) askWho();
}
async function start(){
  if(!configured){ mode = "noconfig"; render(); return; }
  if(!club){ mode = "code"; render(); askCode(); return; }
  mode = "loading"; render();
  try{
    const snap = await fs.doc(P.club(club)).get();
    if(!snap.exists){ local.set("fb_club", null); club = null; mode = "code"; render(); askCode("That code no longer opens the board. Check it with the group."); return; }
    openClub(snap.data());
  }catch{
    stale = true; render();
    window.addEventListener("online", ()=>{ if(mode==="loading") start(); }, {once:true});
  }
}
render();
start();
</script>
